services:
  - type: web
    name: paras-copper-erp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MASTER_CODE
        value: "8808"
      - key: SETH_PIN
        value: "1111"
      - key: SECRET_KEY
        generateValue: true
